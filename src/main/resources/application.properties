# ===================================================================
# Voltbox Hardware Bench — Spring Boot Application Configuration
# ===================================================================
server.port=${PORT:8080}
spring.application.name=voltbox-hardware-bench
spring.jackson.serialization.indent_output=true

# -------------------------------------------------------------------
# Database & Spring Data JPA Configuration (H2 Default / MySQL Ready)
# -------------------------------------------------------------------
# Default H2 Database (MySQL compatibility mode enabled; switchable via env vars to MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./voltbox-db;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Alternative MySQL 8.x Datasource (set SPRING_DATASOURCE_* env vars or uncomment below):
# spring.datasource.url=jdbc:mysql://localhost:3306/voltbox_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=voltbox_secret
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# HikariCP Connection Pool Tuning
spring.datasource.hikari.pool-name=VoltboxHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Hibernate & JPA Entity Persistence Settings
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at /h2-console when running H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# Google Sign-In & Community Settings
# -------------------------------------------------------------------
voltbox.google.client-id=${GOOGLE_CLIENT_ID:8853303342-j5l5dnn3okihtcifetfo1d0prg56ugu9.apps.googleusercontent.com}

# Donation & UPI Settings
voltbox.donate.url=${VOLTBOX_DONATE_URL:https://share.google/5TT6WxXqXBWnaoSIP}
voltbox.donate.upi-id=${VOLTBOX_UPI_ID:harishragavendran08@okaxis}
voltbox.donate.qr=${VOLTBOX_DONATE_QR:donate-qr.jpeg}
voltbox.donate.images=${VOLTBOX_DONATE_IMAGES:}

# Optional SMTP Bill Email Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${VOLTBOX_MAIL_USERNAME:}
spring.mail.password=${VOLTBOX_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
