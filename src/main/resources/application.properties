# runs on port 8080 by default — change here if you need to
server.port=8080
spring.application.name=voltbox

# gateway / resiliency defaults
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
spring.cache.type=simple
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.scheduling.pool.size=4
voltbox.api.connect-timeout-ms=3000
voltbox.api.read-timeout-ms=5000
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=5000
resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=2000
resilience4j.retry.instances.productService.enableExponentialBackoff=true
resilience4j.retry.instances.productService.exponentialBackoffMultiplier=2

# always re-check the html/css/js with the server on a refresh, instead of the
# browser quietly serving an old copy from its cache. this is what makes the
# "edit a file, just refresh the browser" promise actually hold — without it
# you'd sometimes save a change and not see it until a hard reload.
spring.web.resources.cache.cachecontrol.no-cache=true

