version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltbox-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: voltbox-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: voltbox-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
